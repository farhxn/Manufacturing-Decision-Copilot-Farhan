[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-decision-copilot-backend"
version = "0.1.0"
description = "Manufacturing Decision Copilot - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "chromadb==0.5.23",
    "redis==5.2.1",
    "celery==5.4.0",
    "google-genai==0.1.0",
    "openai==1.57.4",
    "pydantic-ai==0.0.14",
    "tiktoken==0.8.0",
    "pymupdf==1.24.14",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "pillow==10.4.0",
    "rank-bm25==0.2.2",
    "aiofiles==24.1.0",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "python-jose[cryptography]==3.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
